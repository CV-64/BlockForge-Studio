<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockForge Studio · Minecraft 1.20.1 Forge 可视化模组制作器</title>
<style>
/* ============ BlockForge Studio ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#14171c; --bg2:#1b1f26; --bg3:#222831; --bg4:#2b323c;
  --line:#343d49; --line2:#414c5a;
  --tx:#e8edf3; --tx2:#a7b3c2; --tx3:#6f7d8e;
  --green:#7ac74f; --green2:#5b9c39; --gold:#e8b64c; --blue:#5aa9e6;
  --red:#e05c4b; --purple:#a887e8; --cyan:#4fc9c0;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --mono:'Consolas','Courier New',monospace;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  font-size:13px; overflow:hidden; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3b4553;border-radius:6px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:#556172}

#app{display:flex;flex-direction:column;height:100vh;min-width:1080px}

/* ---- top bar ---- */
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;background:linear-gradient(180deg,#222831,#1b1f26);border-bottom:1px solid #0d1014;box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:225px}
.brand-cube{width:30px;height:30px;position:relative;transform:rotate(-30deg) skewX(0)}
.brand-cube span{position:absolute;width:16px;height:16px;display:block}
.brand-cube span:nth-child(1){background:#8fd05e;left:7px;top:0;transform:skewY(30deg) rotate(30deg)}
.brand-cube span:nth-child(2){background:#5b9c39;left:0;top:8px;transform:skewY(30deg) rotate(30deg)}
.brand-cube span:nth-child(3){background:#3f7229;left:14px;top:8px;transform:skewY(30deg) rotate(30deg)}
.brand-text b{display:block;font-size:15px;letter-spacing:.4px}
.brand-text b em{color:var(--green);font-style:normal}
.brand-text small{display:block;color:var(--tx3);font-size:9px;letter-spacing:1.3px;margin-top:2px}
.top-proj{display:flex;align-items:center;gap:8px;background:#14181e;border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:230px}
.top-proj label{color:var(--tx3);font-size:11px;white-space:nowrap}
.top-proj input{background:transparent;border:none;width:100%;font-weight:600}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 8px var(--green)}
.save-dot.dirty{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.top-actions{margin-left:auto;display:flex;gap:7px;align-items:center}
.btn{background:var(--bg4);border:1px solid var(--line2);border-radius:5px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--tx2);transition:.15s;white-space:nowrap}
.btn:hover{background:#3a4351;color:var(--tx);transform:translateY(-1px)}
.btn-primary{background:var(--green2);border-color:#79bf52;color:#fff}
.btn-primary:hover{background:#69ae45}
.btn-accent{background:linear-gradient(180deg,#d9a53f,#b9842b);border-color:#e8b64c;color:#20180a}
.btn-accent:hover{background:#e8b64c;color:#20180a}
.btn-danger{color:var(--red)}
.btn-sm{padding:5px 9px;font-size:11px}
.dropdown{position:relative}
.dropdown-menu{display:none;position:absolute;top:calc(100% + 7px);left:0;width:230px;background:var(--bg3);border:1px solid var(--line2);border-radius:7px;box-shadow:var(--shadow);padding:6px;z-index:60}
.dropdown-menu.open{display:block}
.dropdown-menu button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 10px;border-radius:5px;text-align:left;color:var(--tx2)}
.dropdown-menu button:hover{background:var(--bg4);color:var(--tx)}
.dropdown-menu .di{font-size:16px;width:20px;text-align:center}
.dropdown-menu small{display:block;color:var(--tx3);font-size:10px;margin-top:2px}

/* ---- layout ---- */
.body{flex:1;display:flex;min-height:0}
.sidebar{width:238px;flex:none;background:var(--bg2);border-right:1px solid #0d1014;display:flex;flex-direction:column;min-height:0}
.side-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:11px;letter-spacing:.8px;color:var(--tx3);text-transform:uppercase;border-bottom:1px solid var(--line)}
.count{background:var(--bg4);border-radius:9px;padding:1px 7px;color:var(--tx2);font-size:10px}
.side-search{padding:9px 10px}
.side-search input{width:100%;background:#11151a;border:1px solid var(--line);border-radius:5px;padding:7px 9px;font-size:12px}
.side-search input:focus{border-color:var(--green2)}
.elem-list{flex:1;overflow:auto;padding:0 7px 10px}
.elem-group{margin-bottom:9px}
.elem-group h4{font-size:10px;color:var(--tx3);letter-spacing:1px;padding:8px 7px 5px;display:flex;justify-content:space-between}
.elem-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:5px;border:1px solid transparent;cursor:pointer;color:var(--tx2)}
.elem-item:hover{background:var(--bg3)}
.elem-item.active{background:#2c3a2a;border-color:#4c6b3e;color:var(--tx)}
.elem-item .ico{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:4px;background:#11151a;font-size:13px}
.elem-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.elem-item .rn{display:block;font-family:var(--mono);font-size:9px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elem-item .del{opacity:0;color:var(--tx3);font-size:14px;padding:0 3px}
.elem-item:hover .del{opacity:1}
.elem-item .del:hover{color:var(--red)}
.side-project{margin:0 10px 8px;padding:9px;border:1px dashed var(--line2);border-radius:6px;color:var(--tx2);font-size:11px;text-align:left}
.side-project:hover{border-color:var(--green);color:var(--green)}
.side-tip{margin:0 10px 12px;padding:10px;background:#11151a;border:1px solid var(--line);border-radius:6px;color:var(--tx3);font-size:10px;line-height:1.75}
.side-tip b{display:block;color:var(--tx2);font-size:11px;margin-bottom:4px}

.workspace{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.ws-head{min-height:58px;padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.ws-head .title{font-size:17px;font-weight:700}
.ws-head .badge{font-size:10px;padding:3px 8px;border-radius:10px;background:var(--bg4);color:var(--tx2);border:1px solid var(--line2)}
.ws-head .reg{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.ws-head .spacer{flex:1}
.tabs{height:40px;flex:none;display:flex;gap:2px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:0 16px;color:var(--tx3);font-size:12px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--tx2)}
.tabs button.active{color:var(--green);border-bottom-color:var(--green);background:linear-gradient(180deg,transparent,rgba(122,199,79,.07))}
.ws-content{flex:1;min-height:0;overflow:auto;padding:16px}
.tab-panel{display:none;animation:fade .18s ease}
.tab-panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.preview-panel{width:282px;flex:none;background:var(--bg2);border-left:1px solid #0d1014;display:flex;flex-direction:column;min-height:0}
.pv-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:11px;letter-spacing:.8px;color:var(--tx3);text-transform:uppercase;border-bottom:1px solid var(--line)}
.pv-badge{font-size:10px;color:var(--green);background:#26331f;padding:2px 8px;border-radius:9px}
.pv-stage{height:268px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#252c35,#15191f 70%);position:relative;border-bottom:1px solid var(--line)}
#pv-canvas{image-rendering:pixelated;max-width:100%;max-height:100%}
.pv-hint{position:absolute;bottom:9px;font-size:10px;color:var(--tx3)}
.pv-info{padding:12px;font-size:11px;color:var(--tx2);border-bottom:1px solid var(--line);min-height:82px}
.pv-info .row{display:flex;justify-content:space-between;padding:3px 0;gap:8px}
.pv-info .row span:first-child{color:var(--tx3)}
.pv-info .row span:last-child{font-family:var(--mono);color:var(--tx);text-align:right;word-break:break-all}
.pv-log{flex:1;overflow:auto;padding:12px;font-size:10px;color:var(--tx3)}
.pv-log b{color:var(--tx2);display:block;margin-bottom:8px;font-size:11px}
.pv-log .f{padding:3px 0;font-family:var(--mono);border-bottom:1px dotted #2a313a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-log .f i{color:var(--green);font-style:normal}

/* ---- generic cards ---- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.card>h3{font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--tx2);display:flex;align-items:center;gap:8px;background:#1e232b}
.card>h3 .sub{color:var(--tx3);font-weight:400;font-size:10px;margin-left:auto}
.card .inner{padding:14px}
.hint{color:var(--tx3);font-size:11px;line-height:1.7}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.panel-title{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.panel-title .dot{width:6px;height:6px;background:var(--green);border-radius:50%}

/* ---- forms ---- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 14px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:11px;color:var(--tx3);display:flex;gap:5px;align-items:center}
.field>label .q{color:var(--blue);cursor:help;font-size:10px}
.field input[type=text],.field input[type=number],.field select,.field textarea{background:#11151a;border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2);box-shadow:0 0 0 2px rgba(122,199,79,.12)}
.field textarea{resize:vertical;min-height:56px}
.field input[type=range]{width:100%;accent-color:var(--green)}
.field .val{font-family:var(--mono);color:var(--gold);font-size:11px}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check input{accent-color:var(--green);width:15px;height:15px}
.field.check label{font-size:12px;color:var(--tx2);cursor:pointer}
.section-note{grid-column:1/-1;font-size:10px;color:var(--tx3);border-left:2px solid var(--green2);padding:4px 0 4px 9px;background:#1a2119}

/* ---- pixel editor ---- */
.paint-layout{display:grid;grid-template-columns:186px minmax(0,1fr) 178px;gap:14px;align-items:start}
.paint-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.tool-btn{background:#11151a;border:1px solid var(--line);border-radius:5px;padding:8px 4px;font-size:11px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:3px}
.tool-btn .ti{font-size:15px}
.tool-btn:hover{border-color:var(--line2)}
.tool-btn.active{background:#2b3a25;border-color:var(--green);color:var(--green)}
.paint-canvas-wrap{background:#0d1014;border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:420px;justify-content:center}
#paint-canvas{image-rendering:pixelated;cursor:crosshair;background:#222;box-shadow:0 8px 28px rgba(0,0,0,.6);touch-action:none}
/* 项目设置：创造模式栏目图标 / jar 封面图的小型像素编辑器 */
.brand-editor{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:8px}
.brand-canvas-box{flex:0 0 auto;background:#0d1014;border:1px solid var(--line);border-radius:8px;padding:9px}
.brand-canvas-box canvas{display:block;width:232px;height:232px;image-rendering:pixelated;cursor:crosshair;background:#222;touch-action:none}
.brand-tools{flex:1 1 230px;min-width:220px;display:flex;flex-direction:column;gap:10px}
.brand-tools .btn-row{flex-wrap:wrap}
.brand-check{display:flex;align-items:center;gap:8px;height:34px;cursor:pointer;font-size:13px;color:var(--tx2)}
.brand-check input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.tex-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.tex-tabs button{padding:6px 11px;background:#11151a;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--tx2)}
.tex-tabs button.active{border-color:var(--green);color:var(--green);background:#24301f}
.tex-tabs button .mini{display:inline-block;width:11px;height:11px;vertical-align:-2px;margin-right:5px;border:1px solid #000;image-rendering:pixelated}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.swatch{aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.13);cursor:pointer;position:relative}
.swatch.active::after{content:'';position:absolute;inset:-3px;border:2px solid var(--gold);border-radius:6px}
.color-row{display:flex;gap:7px;align-items:center;margin-top:10px}
.color-row input[type=color]{width:36px;height:30px;border:1px solid var(--line);background:#11151a;border-radius:4px;padding:2px;cursor:pointer}
.color-row input[type=text]{flex:1;min-width:0;background:#11151a;border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-family:var(--mono);font-size:11px}
.mini-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.mini-row .btn{padding:5px 8px;font-size:10px}
.zoom-row{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--tx3);font-size:11px;padding-top:4px}
.zoom-row input{accent-color:var(--green);width:110px}

/* ---- recipe editor ---- */
.recipe-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.recipe-chip{background:#11151a;border:1px solid var(--line);border-radius:5px;padding:6px 9px;font-size:11px;color:var(--tx2);display:flex;gap:8px;align-items:center}
.recipe-chip.active{border-color:var(--green);color:var(--green)}
.recipe-chip .x{color:var(--tx3)}
.recipe-chip .x:hover{color:var(--red)}
.craft-area{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.craft-grid{display:grid;grid-template-columns:repeat(3,54px);gap:5px;background:#0e1216;padding:8px;border:1px solid var(--line);border-radius:7px}
.craft-slot{width:54px;height:54px;background:#222831;border:1px solid #3a434f;border-radius:4px;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden}
.craft-slot:hover{border-color:var(--green)}
.craft-slot .sname{font-size:9px;color:var(--tx3);text-align:center;padding:2px;line-height:1.2;word-break:break-all}
.craft-slot canvas{image-rendering:pixelated;max-width:44px;max-height:44px}
.craft-slot .clr{position:absolute;top:0;right:2px;color:var(--red);font-size:12px;display:none}
.craft-slot:hover .clr{display:block}
.arrow{font-size:28px;color:var(--tx3);align-self:center}
.result-box{width:74px;height:74px;background:#1a2a17;border:1px solid #3d5c31;border-radius:6px;display:grid;place-items:center;align-self:center;text-align:center}
.result-box canvas{image-rendering:pixelated;max-width:60px;max-height:60px}
.result-box small{display:block;color:var(--green);font-size:9px}
.ref-picker{position:fixed;z-index:100;background:var(--bg3);border:1px solid var(--line2);border-radius:7px;box-shadow:var(--shadow);width:250px;max-height:320px;overflow:auto;padding:6px}
.ref-picker input{width:100%;background:#11151a;border:1px solid var(--line);border-radius:4px;padding:7px 9px;margin-bottom:6px}
.ref-picker button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:4px;color:var(--tx2);font-size:11px}
.ref-picker button:hover{background:var(--bg4);color:var(--tx)}
.ref-picker .grp{font-size:9px;color:var(--tx3);padding:6px 9px 3px;letter-spacing:1px}
.station-recipe{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#11151a;border:1px solid var(--line);border-radius:6px;padding:9px;margin-bottom:8px}
.station-recipe .ref-btn{min-width:126px;background:var(--bg3);border:1px solid var(--line2);border-radius:4px;padding:6px 8px;font-size:11px;color:var(--tx2);text-align:left}
.station-recipe .ref-btn:hover{border-color:var(--green)}
.station-recipe input[type=number]{width:56px;background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:6px}
.station-recipe .lbl{color:var(--tx3);font-size:11px}

/* ---- GUI designer ---- */
.gui-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;align-items:start}
.gui-stage{background:#0d1014;border:1px solid var(--line);border-radius:8px;padding:18px;overflow:auto;display:grid;place-items:center}
#gui-canvas{image-rendering:pixelated;cursor:default;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.gui-slot{position:absolute;width:36px;height:36px;border:2px solid var(--green);background:rgba(122,199,79,.16);border-radius:3px;cursor:move;display:grid;place-items:center;font-size:9px;color:#dfffd0;text-align:center;line-height:1.1}
.gui-slot.output{border-color:var(--gold);background:rgba(232,182,76,.18);color:#ffe9b0}
.gui-slot.fuel{border-color:var(--red);background:rgba(224,92,75,.16);color:#ffd0c8}
.gui-slot.sel{box-shadow:0 0 0 2px #fff inset}
.gui-slot .idx{position:absolute;top:-8px;left:-2px;font-size:9px;color:var(--tx3)}
.gui-wrap{position:relative}
.slot-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11px}
.slot-row select{background:#11151a;border:1px solid var(--line);border-radius:4px;padding:4px;font-size:11px}
.slot-row .sp{flex:1;color:var(--tx2)}
.slot-row code{color:var(--tx3);font-size:10px}

/* ---- code preview ---- */
.code-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;height:calc(100vh - 190px);min-height:380px}
.file-tree{background:#11151a;border:1px solid var(--line);border-radius:7px;overflow:auto;padding:8px}
.file-tree .dir{color:var(--gold);font-size:11px;font-family:var(--mono);padding:5px 4px}
.file-tree .file{font-family:var(--mono);font-size:10.5px;color:var(--tx2);padding:4px 6px 4px 16px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-tree .file:hover{background:var(--bg3)}
.file-tree .file.active{background:#2a3a24;color:var(--green)}
.file-tree .file .ext{color:var(--tx3)}
.code-view{background:#0d1014;border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;min-width:0}
.code-view .cv-head{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--tx2)}
.code-view .cv-head .sp{flex:1}
.code-view pre{flex:1;overflow:auto;padding:14px;font-family:var(--mono);font-size:11px;line-height:1.6;color:#cfe0d5;white-space:pre;tab-size:4}
.binary-note{padding:24px;color:var(--tx3);text-align:center;line-height:2}
.binary-note canvas{image-rendering:pixelated;margin:12px auto;display:block;border:1px solid var(--line)}

/* ---- misc ---- */
.empty{display:grid;place-items:center;height:100%;color:var(--tx3);text-align:center;line-height:2}
.empty .big{font-size:38px;opacity:.35}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10px;padding:3px 8px;border-radius:9px;background:var(--bg4);color:var(--tx2)}
.tag.g{background:#26331f;color:var(--green)}
.tag.y{background:#3a2f18;color:var(--gold)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#2b323c;border:1px solid var(--line2);box-shadow:var(--shadow);padding:11px 20px;border-radius:7px;font-size:12px;color:var(--tx);opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--red);color:#ffd6d0}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:150}
.modal{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);width:430px;max-height:80vh;overflow:auto}
.modal h3{padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.modal .mc{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.export-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.export-stats div{background:#11151a;border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.export-stats b{display:block;font-size:19px;color:var(--green);font-family:var(--mono)}
.export-stats small{color:var(--tx3);font-size:10px}
.warn{background:#33261a;border:1px solid #6d5227;color:#e8cf9c;border-radius:6px;padding:10px;font-size:11px;line-height:1.7;margin-top:10px}

/* ---- v2: project library ---- */
.top-proj{position:relative}
.lib-switch{color:var(--tx3);font-size:12px;padding:0 3px;line-height:1}
.lib-switch:hover{color:var(--green)}
#lib-menu{top:calc(100% + 9px);left:0;width:270px;max-height:360px;overflow:auto}
#lib-menu .lm-head{padding:7px 10px;color:var(--tx3);font-size:10px;letter-spacing:1px}
#lib-menu button{justify-content:space-between}
#lib-menu button small{color:var(--tx3);font-size:9px}
#lib-menu .lm-cur{color:var(--green)}
.side-project.active{border-style:solid;border-color:var(--green);color:var(--green);background:#1e2b1b}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.proj-card{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:14px;position:relative}
.proj-card.active{border-color:var(--green);box-shadow:0 0 0 1px rgba(122,199,79,.25)}
.proj-card h4{font-size:14px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.proj-card .pill{font-size:9px;background:#2b3a24;color:var(--green);padding:2px 7px;border-radius:9px}
.proj-card .meta{font-size:10px;color:var(--tx3);line-height:1.8;font-family:var(--mono)}
.proj-card .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.proj-card .acts .btn{padding:4px 7px;font-size:10px}
.lib-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.lib-toolbar .sp{flex:1}
.pv-rotate{display:flex;gap:4px;padding:7px 12px;border-bottom:1px solid var(--line);justify-content:center}
.pv-rotate button{background:#11151a;border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:10px;color:var(--tx3)}
.pv-rotate button.active{border-color:var(--green);color:var(--green);background:#24301f}
.pv-rotate span{font-size:10px;color:var(--tx3);align-self:center;margin-right:4px}

/* ---- v2: paint tools ---- */
.paint-tools.four{grid-template-columns:repeat(4,1fr);gap:4px}
.paint-tools.four .tool-btn{padding:6px 2px;font-size:10px}
.tool-group{margin-bottom:10px}
.tool-group h5{font-size:10px;color:var(--tx3);letter-spacing:.8px;margin:7px 0 5px;border-left:2px solid var(--green2);padding-left:6px}
.seg{display:flex;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:26px;background:#11151a;border:1px solid var(--line);border-radius:4px;padding:5px 2px;font-size:10px;color:var(--tx2)}
.seg button:hover{border-color:var(--line2)}
.seg button.active{background:#2b3a25;border-color:var(--green);color:var(--green)}
.swatches.eight{grid-template-columns:repeat(8,1fr);gap:3px}
.color-history{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hist-dot{width:17px;height:17px;border-radius:3px;border:1px solid rgba(255,255,255,.15);cursor:pointer}
.dual-color{display:flex;align-items:center;gap:7px;margin-top:9px}
.dual-color .box{width:30px;height:30px;border:1px solid var(--line2);border-radius:4px;cursor:pointer}
.dual-color small{color:var(--tx3);font-size:10px}
.mini-slider{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10px;color:var(--tx3)}
.mini-slider input{flex:1;accent-color:var(--green)}
.tex-tabs .mini{width:11px;height:11px;display:inline-block;vertical-align:-2px;margin-right:4px;border:1px solid #000;image-rendering:pixelated}
.face-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* ---- v2: ore / tool / effect / recipes ---- */
.multi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.multi-item{display:flex;align-items:center;gap:6px;background:#11151a;border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:11px;color:var(--tx2);cursor:pointer}
.multi-item:hover{border-color:var(--line2)}
.multi-item input{accent-color:var(--green);width:14px;height:14px}
.multi-item.on{border-color:var(--green);color:var(--tx);background:#1e2b1b}
.api-note{background:#11151a;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:5px;padding:10px;font-size:10.5px;line-height:1.85;color:var(--tx3);margin-top:10px}
.api-note b{color:var(--blue)}
.api-note code{color:var(--gold);font-family:var(--mono);font-size:10px}
.rec-table{background:#11151a;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.rec-row{display:grid;grid-template-columns:26px minmax(120px,1.5fr) 90px 78px 88px 66px 150px;gap:8px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line);font-size:11px}
.rec-row:last-child{border-bottom:none}
.rec-row.head{background:#1e232b;color:var(--tx3);font-size:10px;letter-spacing:.5px}
.rec-row .ic{font-size:14px;text-align:center}
.rec-row input[type=checkbox]{accent-color:var(--green);width:15px;height:15px}
.rec-row .btn{padding:4px 7px;font-size:10px}
.switch-line{display:flex;align-items:center;gap:10px;background:#11151a;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.switch-line input{accent-color:var(--green);width:16px;height:16px}
.switch-line b{font-size:12px}
.switch-line span{color:var(--tx3);font-size:10.5px}
.modal .mc .field{margin-bottom:10px}
.modal .mc input{width:100%;background:#11151a;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:12px}
.stat-line{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--tx2);margin-top:8px}
.stat-line b{color:var(--green);font-family:var(--mono)}

/* ---- v3: creature tables ---- */
.mob-table{width:100%;border-collapse:collapse;font-size:11px;background:#11151a;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mob-table th{background:#1e232b;color:var(--tx3);font-size:10px;font-weight:600;padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.mob-table td{padding:4px;border-bottom:1px solid var(--line)}
.mob-table tr:last-child td{border-bottom:none}
.mob-table input[type=number],.mob-table input[type=text]{background:#0d1014;border:1px solid var(--line);border-radius:4px;padding:4px 5px;font-size:11px;width:100%}
.mob-table input[type=color]{cursor:pointer}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-cube"><span></span><span></span><span></span></div>
      <div class="brand-text"><b>BlockForge <em>Studio</em></b><small>MC 1.20.1 · FORGE · JAVA EDITION</small></div>
    </div>
    <div class="top-proj">
      <label>项目</label>
      <input id="proj-name" type="text" spellcheck="false" placeholder="我的模组">
      <button class="lib-switch" id="btn-lib-menu" title="切换 / 管理项目">▾</button>
      <div class="dropdown-menu" id="lib-menu"></div>
      <span class="save-dot" id="save-dot" title="自动保存状态"></span>
    </div>
    <div class="top-actions">
      <div class="dropdown">
        <button class="btn btn-primary" id="btn-add">＋ 新建元素</button>
        <div class="dropdown-menu" id="add-menu"></div>
      </div>
      <button class="btn" id="btn-import" title="导入 .mcmproj 项目文件">导入</button>
      <button class="btn" id="btn-save" title="导出可再次编辑的项目文件">保存项目</button>
      <button class="btn btn-accent" id="btn-export" title="导出完整 Forge Java 源码工程">⬇ 导出 Java 工程</button>
      <input type="file" id="file-import" accept=".json,.mcmproj" hidden>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="side-head">
        <span>元素资源管理器</span>
        <span class="count" id="elem-count">0</span>
      </div>
      <div class="side-search"><input id="elem-search" type="text" placeholder="搜索元素…" spellcheck="false"></div>
      <div class="elem-list" id="elem-list"></div>
      <button class="side-project" id="btn-library">▦ 项目库 / 多项目管理</button>
      <button class="side-project" id="btn-project">⚙ 项目设置 / 模组信息</button>
      <div class="side-tip">
        <b>快速上手</b>
        1. 左侧新建元素<br>
        2. 「外观绘制」画贴图<br>
        3. 「功能属性」调数值<br>
        4. 「合成配方」定获取方式<br>
        5. 右上角导出 Java 工程
      </div>
    </aside>

    <main class="workspace">
      <div class="ws-head" id="ws-head"></div>
      <nav class="tabs" id="tabs"></nav>
      <div class="ws-content" id="ws-content"></div>
    </main>

    <aside class="preview-panel">
      <div class="pv-head"><span>实时预览</span><span class="pv-badge" id="pv-type">—</span></div>
      <div class="pv-rotate" id="pv-rotate"></div>
      <div class="pv-stage">
        <canvas id="pv-canvas" width="300" height="300"></canvas>
        <div class="pv-hint" id="pv-hint"></div>
      </div>
      <div class="pv-info" id="pv-info"></div>
      <div class="pv-log"><b>导出内容</b><div id="pv-files"></div></div>
    </aside>
  </div>
</div>

  if (t) return t;

  return 'custom_' + h.toString(36);
};

};

};
BF.rgb2hsl = function (hex) {
  var c = BF.hex2rgb(hex).map(function (v) { return v/255; });
  var r=c[0],g=c[1],b=c[2], mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  var l=(mx+mn)/2, s=d===0?0:d/(1-Math.abs(2*l-1)), h=0;

/* ---------- procedural default textures (six faces) ---------- */
function oreTex(base, spot, seed) {
  return BF.tex(function (x,y) {
    var n = ((x*73 + y*151 + seed*29) % 17);
    var c = n < 3 ? BF.shade(base,1.12) : (n > 14 ? BF.shade(base,.86) : base);
    var clusters = [[3,3],[11,4],[5,10],[12,11],[2,12],[9,8]];
    for (var i=0;i<clusters.length;i++) {
      var cx = clusters[i][0]+((seed+i)%2), cy = clusters[i][1]+((seed*3+i)%2);
      if (x>=cx && x<=cx+2 && y>=cy && y<=cy+2) {
        if (x===cx && y===cy) return BF.shade(spot,1.35);
        if ((x+y+seed)%3===0) return BF.shade(spot,.78);
        return spot;
      }
    }
    return c;
  });
}
function runeTex(seed) {
  seed = seed || 0;
  return BF.tex(function (x,y) {
    var edge = x===0||y===0||x===15||y===15;
    if (edge) return (x+y+seed)%2 ? '#3a2f56' : '#2a2240';
    if ((x===2||x===13||y===2||y===13) && x>1&&x<14&&y>1&&y<14) return '#4fc9c0';
    var cx = Math.abs(x-7.5), cy = Math.abs(y-7.5);
    if ((cx<1&&cy<5) || (cy<1&&cx<5) || (cx+cy<5.2 && cx+cy>4.1)) return '#8fe3dc';
    if ((x*7+y*11+seed)%13===0) return '#6b3fa0';
    return '#1c1729';
  });
}

/* ---------- Blockbench 导入 ----------
   支持：
   · .bbmodel —— 解析其中 type=cube 的 elements 转为部件表（size/pivot/offset），
     含 animations 时一并返回（1.20.1 客户端 bones 格式，可直接写进导出工程）
   · .java —— Blockbench 的 Java 模型导出，原样交给导出器
   · 动画 JSON —— {animations:{...}} 结构
   坐标约定：Blockbench 与原版实体一致，y 向上、0 在脚底。 */
BF.parseBBModel = function (text) {
  var obj = JSON.parse(text);
  var used = {};
  function uniq(n) {
    n = String(n || 'part').toLowerCase().replace(/[^a-z0-9_]/g, '_').replace(/^_+|_+$/g, '') || 'part';
    var base = n, i = 2;
    while (used[n]) { n = base + '_' + (i++); }
    used[n] = 1;
    return n;
  }
  function r3(v) { return Math.round(v * 1000) / 1000; }
  var parts = [];
  (obj.elements || []).forEach(function (el) {
    if (el.type && el.type !== 'cube') return;      /* 跳过 group 等，v1 只处理长方体 */
    if (!Array.isArray(el.from) || !Array.isArray(el.to)) return;
    var size = [
      Math.max(0.5, r3(el.to[0] - el.from[0])),
      Math.max(0.5, r3(el.to[1] - el.from[1])),
      Math.max(0.5, r3(el.to[2] - el.from[2]))];
    var pivot = Array.isArray(el.origin) && el.origin.length >= 3
      ? [r3(el.origin[0]), r3(el.origin[1]), r3(el.origin[2])]
      : [r3((el.from[0] + el.to[0]) / 2), r3(el.from[1]), r3((el.from[2] + el.to[2]) / 2)];
    parts.push({
      name: uniq(el.name),
      pivot: pivot,
      offset: [r3(el.from[0] - pivot[0]), r3(el.from[1] - pivot[1]), r3(el.from[2] - pivot[2])],
      size: size,
      color: '#8fb8e8'
    });
  });

BF.mobUVLayout = function (parts, texW) {

  (parts || []).forEach(function (p) {
    var w = p.size[0], h = p.size[1], d = p.size[2];
    var bw = 2*(d+w), bh = d+h;
    if (u > 0 && u + bw > texW) { u = 0; v += rowH; rowH = 0; }
    out.push({ name:p.name, u:u, v:v, w:w, h:h, d:d,
      color:p.color || '#cccccc', pivot:p.pivot, offset:p.offset });
    u += bw;

};
BF.mobSkinTexture = function (parts, texW, texH) {

    for (var j=0;j<h;j++) for (var i=0;i<w;i++) {

    var c = L.color;
    face(L.u, L.v, L.w, L.d, c, 1.0);
    face(L.u+L.d, L.v, L.w, L.d, c, 0.78);
    face(L.u+L.d+L.w, L.v, L.d, L.h, c, 0.88);
    face(L.u+L.d+L.w+L.d, L.v, L.w, L.h, c, 1.0);
    face(L.u+2*L.d+2*L.w, L.v, L.d, L.h, c, 0.85);
    face(L.u+2*L.d+2*L.w+L.d, L.v, L.w, L.h, c, 0.7);

BF.mobEggTexture = function (bg, spot) {

};

  return BF.tex(function (x,y) {
    if (x===0||y===0||x===15||y===15) return '#141a1e';
    var base = kind === 'generator' ? '#4a4436' : '#25333a';
    var c = ((x*7+y*11+seed)%13===0) ? BF.shade(base,1.18) : base;
    if (kind === 'generator' && x>=3&&x<=12&&y>=3&&y<=12) {
      var d = Math.abs(x-7.5)+Math.abs(y-7.5);
      if (d<3.5) return '#ffe9a0';
      if (d<5.2) return '#e8732a';
      if (d<6.5) return '#8b3f16';

  });
}
function iconCluster() {

    if (dy<1.5 && dx<7) return '#a887e8';

  var seen = {};

    var e = BF.clone(raw);

    if (seen[r]) { var n = 2; while (seen[r+'_'+n]) n++; r = r + '_' + n; }
    seen[r] = 1;
    e._reg = r;
    e._up = BF.upper(r);

    e._isBlockItem = e._isBlock || e.type === 'cluster';
    return e;
  });

    projectImports.push(
      'import ' + pkg + '.block.entity.*;',
      'import ' + pkg + '.menu.*;',
      'import ' + pkg + '.client.screen.*;');
  }
  if (types.mob) {

      'import ' + pkg + '.entity.*;',
      'import ' + pkg + '.entity.model.*;',
      'import ' + pkg + '.client.*;');

  if (!ct.title) ct.title = m.name || modid;

    ct.icon = BF.defaultCreativeTabIcon();
  var packIcon = (m.packIcon && Array.isArray(m.packIcon.data) && m.packIcon.data.length === 4096)
    ? m.packIcon : BF.defaultPackIcon();

    m: m, modid: modid, pkg: pkg, pkgPath: pkg.replace(/\./g,'/'),
    root: modid + '/', els: els, byId: byId,
    ct: ct, packIcon: packIcon,
    mainCls: mainCls,

}

      if (r.shapeless) {
        var ing = [];
        Object.keys(key).forEach(function (L) { ing.push(key[L]); });
        json = { type:'minecraft:crafting_shapeless', ingredients:ing, result:result };
      } else {
        var rows = [];
        for (var y=0;y<3;y++) rows.push(cells.slice(y*3,y*3+3).join(''));
        /* trim empty border rows/columns */
        while (rows.length && rows[0].trim()==='') rows.shift();
        while (rows.length && rows[rows.length-1].trim()==='') rows.pop();
        if (rows.length) {
          var minC = 2, maxC = 0;
          rows.forEach(function (row) { for (var i=0;i<3;i++) if (row[i] !== ' ') { minC = Math.min(minC,i); maxC = Math.max(maxC,i); } });
          rows = rows.map(function (row) { return row.substring(minC, maxC+1); });
        }
        json = { type:'minecraft:crafting_shaped', pattern:rows, key:key, result:result };
      }
    } else if (r.type === 'smelting' || r.type === 'blasting' || r.type === 'smoking' || r.type === 'campfire') {
      var input = null;
      for (var i=0;i<9;i++) if (refKeyOf(grid[i],c)) { input = { item:refKeyOf(grid[i],c) }; break; }
      if (input) json = { type:'minecraft:' + r.type, ingredient:input, result:result,
        experience: Number(r.xp) || 0.5, cookingtime: num(r.time,200) };
    } else if (r.type === 'stonecutting') {
      var inp = null;
      for (var j=0;j<9;j++) if (refKeyOf(grid[j],c)) { inp = { item:refKeyOf(grid[j],c) }; break; }
      if (inp) json = { type:'minecraft:stonecutting', ingredient:inp, result:result };
    }
    if (json) out.push({ path:path, content:JSON.stringify(json,null,2) + '\n' });
  });
  return out;
}

function buildGradle(c) {
  return [
'plugins {',
"    id 'eclipse'",
"    id 'idea'",
"    id 'maven-publish'",
"    id 'net.minecraftforge.gradle' version '[6.0,6.2)'",
'}',
'',
"version = '" + (c.m.version || '1.0.0') + "'",
"group = '" + c.pkg + "'",
"base { archivesName = '" + c.modid + "' }",
'',
'// 兼容方案：当前 JVM 就是 17 时指定工具链；否则用当前 JDK + --release 17 编译（可兼容 JDK 21）',
'if (JavaVersion.current() == JavaVersion.VERSION_17) {',
'    java.toolchain.languageVersion = JavaLanguageVersion.of(17)',
'}',
'',
'minecraft {',
"    mappings channel: 'official', version: '" + BF.MC_VERSION + "'",
'    copyIdeResources = true',
'    runs {',
'        configureEach {',
"            workingDirectory project.file('run')",
"            property 'forge.logging.markers', 'REGISTRIES'",
"            property 'forge.logging.console.level', 'debug'",
"            mods { '" + c.modid + "' { source sourceSets.main } }",
'        }',
'        client {',
"            property 'forge.enabledGameTestNamespaces', '" + c.modid + "'",
'        }',
'        server {',
"            property 'forge.enabledGameTestNamespaces', '" + c.modid + "'",
"            args '--nogui'",
'        }',
'        gameTestServer {',
"            property 'forge.enabledGameTestNamespaces', '" + c.modid + "'",
'        }',
'        data {',
"            args '--mod', '" + c.modid + "', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')",
'        }',
'    }',
'}',
'',
'sourceSets.main.resources {',
'    srcDir "src/generated/resources"',
'}',
'',
'/* 编辑器把资源生成在工程根目录的 assets/ 与 data/ 下。',
'   注意：绝对不能把这两个目录直接注册成资源根（srcDir 方式）——',
'   Gradle 会把它们当作资源根，打包时丢掉 assets/、data/ 两层前缀，',
'   jar 内变成 newmod/lang/... 而不是 assets/newmod/lang/...，',
'   Minecraft 因此读不到贴图、语言文件与配方（表现为贴图紫黑、名称显示 ID、无合成）。',
'   用 from/into 原样并入资源根，层级才完整。 */',
'processResources {',
'    from("assets") { into "assets" }',
'    from("data")   { into "data"   }',
'}',
'',
'repositories { mavenCentral() }',
'',
'dependencies {',
"    minecraft 'net.minecraftforge:forge:" + BF.MC_VERSION + "-" + BF.FORGE_VERSION + "'",
'}',
'',
'tasks.withType(JavaCompile).configureEach {',
"    options.encoding = 'UTF-8'",
"    options.release = 17",
'}',
''
  ].join('\n');
}
/* ---------- one-click build scripts ---------- */
/* build.bat 必须满足两条硬规则，否则 cmd 会把行切碎执行：
   1) 纯 ASCII：中文注释 + 中途 chcp 65001 会造成 GBK/UTF-8 字节偏移错位、跳行；
   2) CRLF 行尾：cmd 对 LF-only 的括号块与 for 循环解析不稳。
   中文说明放在 build.sh 与 README.md，bat 内只保留英文。 */
function buildBatScript(c) {
  /* 用 modid（slug 保证 ASCII），避免项目名里的中文进入 bat 文件 */
  var name = c.modid;
  /* 三条硬规则：
     1) 纯 ASCII + CRLF（否则 cmd 字节偏移错位、把行切碎执行）
     2) 不用 if (...) 括号块：块内的裸括号（如 "(need 17)"）会被当成块结束符，
        把块结构搞乱，导致成功也走失败分支 —— 改用 goto
     3) echo 文本里不出现裸括号与未转义 % */
  return [
"@echo off",
"REM ============================================================",
"REM  " + name + " - one-click build script for Windows",
"REM  Generated by BlockForge Studio",
"REM ============================================================",
"setlocal",
"cd /d \"%~dp0\"",
"",
"where java >nul 2>&1",
"if errorlevel 1 goto :nojava",
"",
"echo [1/2] Building mod via gradlew build ...",
"echo       First run downloads Gradle and Forge deps, usually 5-20 minutes.",
"",
"call gradlew.bat build %*",
"if errorlevel 1 goto :fail",
"",
"echo [2/2] Build successful!",
"echo.",
"if not exist \"build\\libs\\*.jar\" goto :nojar",
"for %%F in (\"build\\libs\\*.jar\") do echo       %%F",
"goto :done",
"",
":nojar",
"echo       Warning: no jar found in build\\libs - check gradle output above.",
"goto :done",
"",
":done",
"echo.",
"echo Copy the jar above into your Minecraft mods folder:",
"echo   Windows  : %APPDATA%\\.minecraft\\mods\\",
"echo   Linux/mac: ~/.minecraft/mods/",
"echo.",
"pause",
"exit /b 0",
"",
":nojava",
"echo.",
"echo [ERROR] Java not found. Please install JDK 17 first:",
"echo         https://adoptium.net/temurin/releases/?version=17",
"echo         Then reopen the command prompt and run this script again.",
"echo.",
"pause",
"exit /b 1",
"",
":fail",
"echo.",
"echo [ERROR] Build failed. Common causes:",
"echo         - wrong JDK version, need 17",
"echo         - no network access or low disk space",
"echo         See README.md for troubleshooting.",
"echo.",
"pause",
"exit /b 1",
""
  ].join("\r\n");
}
function buildShScript(c) {
  return [
'#!/usr/bin/env bash',
'# ============================================================',
'#  ' + (c.m.name || c.modid) + ' — 一键构建脚本 (Linux / macOS)',
'#  生成自 BlockForge Studio',
'# ============================================================',
'set -e',
'cd "$(dirname "$0")"',
'',
'if ! command -v java >/dev/null 2>&1; then',
'  echo "[错误] 没有找到 Java。请先安装 JDK 17：https://adoptium.net/"',
'  exit 1',
'fi',
'',
'echo "[1/2] 正在构建模组 (./gradlew build) ..."',
'echo "      首次运行会下载 Gradle 与 Forge 依赖，请耐心等待。"',
'chmod +x ./gradlew 2>/dev/null || true',
'./gradlew build "$@"',
'',
'echo "[2/2] 构建完成！产物位于 build/libs/"',
'ls -lh build/libs/*.jar 2>/dev/null || true',
'echo "把 jar 复制到 ~/.minecraft/mods/ 即可安装。"',
''
  ].join('\n');
}

/* ---------- main builder ---------- */
BF.buildProject = function (state, opts) {
  opts = opts || {};
  var c = prepare(state);
  var enc = opts.png || function (tex) { return BF.textureBase64(tex); };
  var files = [];
  function add(rel, content) { files.push({ path: c.root + rel, content:content, binary:false }); }
  function addImg(rel, tex) { files.push({ path: c.root + rel, content:enc(tex), binary:true }); }
  function addBin(rel, b64) { files.push({ path: c.root + rel, content:b64, binary:true }); }
  var A = 'assets/' + c.modid + '/', D = 'data/' + c.modid + '/';
  var stations = c.els.filter(function (e) { return e.type === 'workstation'; });
  var blocks = c.els.filter(function (e) { return e._isBlock; });

  /* build files */
  add('build.gradle', buildGradle(c));
  add('settings.gradle', [
    'pluginManagement {', '    repositories {', '        gradlePluginPortal()',
    "        maven { url = 'https://maven.minecraftforge.net/' }", '    }', '}',
    '',
    "plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0' }",
    '',
    "rootProject.name = '" + c.modid + "'", ''
  ].join('\n'));
  add('gradle.properties', [
    '# 需要 JDK 17；若本机是其它版本，Gradle 会通过 foojay 自动下载 JDK 17',
    'org.gradle.jvmargs=-Xmx3G',
    'org.gradle.daemon=false',
    'org.gradle.parallel=true',
    ''
  ].join('\n'));
  add('.gitignore', ['# Gradle','.gradle/','build/','run/','*.iml','.idea/','eclipse/','',''].join('\n'));
  add('src/main/resources/META-INF/mods.toml', [
    'modLoader="javafml"',
    'loaderVersion="[47,)"',
    'license="' + (c.m.license || 'MIT') + '"',
    'issueTrackerURL=""',
    '[[mods]]',
    'modId="' + c.modid + '"',
    'version="' + (c.m.version || '1.0.0') + '"',
    'displayName="' + (c.m.name || c.modid) + '"',
    'logoFile="pack.png"',
    'authors="' + (c.m.author || 'BlockForge Studio') + '"',
    "description='''" + (c.m.description || '由 BlockForge Studio 生成') + "'''",
    '',
    '[[dependencies.' + c.modid + ']]',
    '    modId="forge"', '    mandatory=true', '    versionRange="[47,)"',
    '    ordering="NONE"', '    side="BOTH"',
    '[[dependencies.' + c.modid + ']]',
    '    modId="minecraft"', '    mandatory=true',
    '    versionRange="[1.20.1,1.21)"', '    ordering="NONE"', '    side="BOTH"',
    ''
  ].join('\n'));
  add('src/main/resources/pack.mcmeta', JSON.stringify({ pack:{
    description: (c.m.description || (c.m.name || c.modid) + ' resources'), pack_format:15,
    'forge:server_data_pack_format':12 } }, null, 2) + '\n');
  /* jar 根目录封面图：资源包选择界面显示，mods.toml 里也声明为 logoFile */
  addImg('src/main/resources/pack.png', c.packIcon);

  /* java */
  var J = c.java;
  add(J + c.mainCls + '.java', mainClass(c));
  add(J + 'ModMaterials.java', materialsClass(c));
  add(J + 'registry/ModItems.java', itemsRegistry(c));
  if (c.ct.enabled !== false) add(J + 'registry/ModCreativeTabs.java', creativeTabsClass(c));
  var blocksReg = blocksRegistry(c);
  if (blocksReg) add(J + 'registry/ModBlocks.java', blocksReg);
  var beReg = blockEntitiesRegistry(c);
  if (beReg) add(J + 'registry/ModBlockEntities.java', beReg);
  var menuReg = menuTypesRegistry(c);
  if (menuReg) add(J + 'registry/ModMenuTypes.java', menuReg);
  var clientSetup = clientSetupClass(c);
  if (clientSetup) add(J + 'client/ClientSetup.java', clientSetup);
  var clusters = c.els.filter(function (e) { return e.type === 'cluster'; });
  var energyEls = c.els.filter(function (e) {
    return e.type === 'energy' || e.type === 'generator' || e.type === 'workstation'; });
  if (energyEls.length) add(J + 'energy/ModEnergy.java', energyRouterClass(c));
  if (clusters.length) {
    add(J + 'registry/ModFeatures.java', featuresRegistryClass(c));
    clusters.forEach(function (e) {
      add(J + 'worldgen/feature/' + e._cls + 'Feature.java', clusterFeatureClass(e,c));
    });
  }
  var mobs = c.els.filter(function (e) { return e.type === 'mob'; });
  if (mobs.length) {
    add(J + 'registry/ModEntities.java', entitiesRegistryClass(c));
    mobs.forEach(function (e) {
      add(J + 'entity/' + e._cls + 'Entity.java', mobEntityClass(e,c));
      add(J + 'entity/model/' + e._cls + 'Model.java', mobModelClass(e,c));
      add(J + 'client/' + e._cls + 'Renderer.java', mobRendererClass(e,c));
      add(J + 'item/' + e._cls + 'SpawnEgg.java', mobSpawnEggClass(e,c));
    });
  }
  c.els.forEach(function (e) {
    add(J + 'item/' + e._cls + 'Item.java', itemClass(e,c));
    if (e._isBlock || e.type === 'cluster') add(J + 'block/' + e._cls + 'Block.java', blockClass(e,c));
    if (e.type === 'workstation') {
      add(J + 'block/entity/' + e._cls + 'BlockEntity.java', blockEntityClass(e,c));
      add(J + 'menu/' + e._cls + 'Menu.java', menuClass(e,c));
      add(J + 'client/screen/' + e._cls + 'Screen.java', screenClass(e,c));
    }
    if (e.type === 'energy' || e.type === 'generator') {
      add(J + 'block/entity/' + e._cls + 'BlockEntity.java', energyBlockEntityClass(e,c));
    }
  });

  /* assets: models / blockstates / textures / lang */
  var en = {}, zh = {};
  c.els.forEach(function (e) {
    var key = (e.type === 'mob' ? 'entity.' :
      (e._isBlock || e.type === 'cluster' ? 'block.' : 'item.')) + c.modid + '.' + e._reg;
    en[key] = helpfulName(e._reg);
    zh[key] = e.name || helpfulName(e._reg);
    if (e.type === 'mob') {
      en['item.' + c.modid + '.' + e._reg + '_spawn_egg'] = (e.name || helpfulName(e._reg)) + ' Spawn Egg';
      zh['item.' + c.modid + '.' + e._reg + '_spawn_egg'] = (e.name || helpfulName(e._reg)) + ' 刷怪蛋';
    }
    if (e.desc) {
      en['tooltip.' + c.modid + '.' + e._reg] = e.desc;
      zh['tooltip.' + c.modid + '.' + e._reg] = e.desc;
    }
    if (e.type === 'workstation') {
      en['container.' + c.modid + '.' + e._reg] = helpfulName(e._reg);
      zh['container.' + c.modid + '.' + e._reg] = e.guiTitle || e.name;
    }
    if (e._isBlock) {
      var faceTex = {};
      ['top','bottom','front','back','left','right'].forEach(function (k) {
        faceTex[BF.FACE_FILE[k]] = c.modid + ':block/' + e._reg + '_' + k;
      });
      add(A + 'models/block/' + e._reg + '.json', JSON.stringify({
        parent:'minecraft:block/cube', textures:faceTex }, null, 2) + '\n');
      add(A + 'models/item/' + e._reg + '.json', JSON.stringify({
        parent:c.modid+':block/'+e._reg }, null, 2) + '\n');
      var bmodel = c.modid + ':block/' + e._reg;
      add(A + 'blockstates/' + e._reg + '.json', JSON.stringify({ variants:{
        'facing=north':{ model:bmodel },
        'facing=east':{ model:bmodel, y:90 },
        'facing=south':{ model:bmodel, y:180 },
        'facing=west':{ model:bmodel, y:270 }
      } }, null, 2) + '\n');
      ['top','bottom','front','back','left','right'].forEach(function (k) {
        addImg(A + 'textures/block/' + e._reg + '_' + k + '.png',
          e.textures[k] || e.textures.side || e.textures.top || e.textures.main);
      });
    } else if (e.type === 'mob') {
      var mcfg = e.mobCfg || {};
      addImg(A + 'textures/entity/' + e._reg + '.png',
        e.textures.skin || BF.mobSkinTexture(e.mobParts || []));
      addImg(A + 'textures/item/' + e._reg + '_spawn_egg.png',
        e.textures.egg || BF.mobEggTexture(mcfg.eggColor || '#3a3a4a', mcfg.eggSpot || '#8fe3dc'));
      add(A + 'models/item/' + e._reg + '_spawn_egg.json', JSON.stringify({
        parent:'minecraft:item/generated',
        textures:{ layer0:c.modid + ':item/' + e._reg + '_spawn_egg' } }, null, 2) + '\n');
      var animJson = mobAnimationJson(e);
      if (animJson) add(A + 'animations/' + e._reg + '.animation.json', animJson);
    } else {
      /* vanilla swords/tools use item/handheld: correct first/third-person grip transforms */
      var im = e.itemModel || 'auto';
      if (im === 'auto') im = (e.type === 'tool' || e.type === 'weapon') ? 'handheld' : 'generated';
      if (['generated','handheld'].indexOf(im) < 0) im = 'generated';
      add(A + 'models/item/' + e._reg + '.json', JSON.stringify({
        parent:'minecraft:item/' + im, textures:{ layer0:c.modid+':item/'+e._reg } }, null, 2) + '\n');
      addImg(A + 'textures/item/' + e._reg + '.png', e.textures.main);
      if (e.type === 'cluster') {
        var cm = c.modid + ':block/' + e._reg;
        add(A + 'models/block/' + e._reg + '.json', JSON.stringify({
          parent:'minecraft:block/cross', textures:{ cross:cm } }, null, 2) + '\n');
        add(A + 'blockstates/' + e._reg + '.json', JSON.stringify({ variants:{
          'facing=up':{model:cm}, 'facing=down':{model:cm,x:180},
          'facing=north':{model:cm,x:90}, 'facing=south':{model:cm,x:90,y:180},
          'facing=west':{model:cm,x:90,y:270}, 'facing=east':{model:cm,x:90,y:90}
        } }, null, 2) + '\n');
        addImg(A + 'textures/block/' + e._reg + '.png', e.textures.main);
      }
    }
    if (e.type === 'armor') {
      addImg(A + 'textures/models/armor/' + e._reg + '_layer_1.png', armorLayerTex(e,1));
      addImg(A + 'textures/models/armor/' + e._reg + '_layer_2.png', armorLayerTex(e,2));
    }
    if (e.type === 'workstation') addImg(A + 'textures/gui/' + e._reg + '.png', BF.guiTexture(e));
  });
  if (c.ct.enabled !== false) {
    add(A + 'models/item/creative_tab_icon.json', JSON.stringify({
      parent:'minecraft:item/generated',
      textures:{ layer0: c.modid + ':item/creative_tab_icon' } }, null, 2) + '\n');
    addImg(A + 'textures/item/creative_tab_icon.png', c.ct.icon);
    var tabTitle = c.ct.title || c.m.name || c.modid;
    en['itemGroup.' + c.modid + '.main'] = tabTitle;
    zh['itemGroup.' + c.modid + '.main'] = tabTitle;
    en['item.' + c.modid + '.creative_tab_icon'] = tabTitle + ' Tab Icon';
    zh['item.' + c.modid + '.creative_tab_icon'] = tabTitle + ' 栏目图标';
  }
  add(A + 'lang/en_us.json', JSON.stringify(en,null,2) + '\n');
  add(A + 'lang/zh_cn.json', JSON.stringify(zh,null,2) + '\n');

  /* data: recipes / loot / tags */
  c.els.forEach(function (e) {
    recipesFor(e,c).forEach(function (f) { add(f.path, f.content); });
    oreFiles(e,c).forEach(function (f) { add(f.path, f.content); });
    clusterFiles(e,c).forEach(function (f) { add(f.path, f.content); });
  });
  clusters.forEach(function (e) {
    add(D + 'loot_tables/blocks/' + e._reg + '.json', JSON.stringify({
      type:'minecraft:block', pools:[{ rolls:1, bonus_rolls:0, entries:[{
        type:'minecraft:item', name:c.modid+':'+e._reg,
        conditions:[{ condition:'minecraft:survives_explosion' }] }] }],
      random_sequence:c.modid+':blocks/'+e._reg }, null, 2) + '\n');
  });
  blocks.forEach(function (e) {
    var pool = e.dropSelf === false ? [] : [{
      rolls:1, bonus_rolls:0,
      entries:[{ type:'minecraft:item', name:c.modid+':'+e._reg,
        conditions:[{ condition:'minecraft:survives_explosion' }] }]
    }];
    add(D + 'loot_tables/blocks/' + e._reg + '.json',
      JSON.stringify({ type:'minecraft:block', pools:pool, random_sequence:c.modid+':blocks/'+e._reg }, null, 2) + '\n');
  });
  var byTool = {}, byTier = {};
  blocks.forEach(function (e) {
    if (e.tool && e.tool !== 'none') (byTool[e.tool] = byTool[e.tool] || []).push(c.modid+':'+e._reg);
    var lvl = num(e.harvestLevel,0), tk = ({0:'wood',1:'stone',2:'iron',3:'diamond',4:'diamond'})[lvl] || 'wood';
    if (e.tool && e.tool !== 'none' && lvl > 0) (byTier[tk] = byTier[tk] || []).push(c.modid+':'+e._reg);
  });
  Object.keys(byTool).forEach(function (t) {
    add(D + 'tags/blocks/mineable/' + t + '.json',
      JSON.stringify({ replace:false, values:byTool[t] }, null, 2) + '\n');
  });
  Object.keys(byTier).forEach(function (t) {
    add(D + 'tags/blocks/needs_' + t + '_tool.json',
      JSON.stringify({ replace:false, values:byTier[t] }, null, 2) + '\n');
  });

  /* project source */
  add('.modmaker/project.json', JSON.stringify(state,null,2) + '\n');

  /* Gradle Wrapper：让用户无需安装 Gradle，双击 build.bat 即可构建 */
  if (BF.GRADLE_WRAPPER_JAR_B64) {
    addBin('gradle/wrapper/gradle-wrapper.jar', BF.GRADLE_WRAPPER_JAR_B64);
    add('gradle/wrapper/gradle-wrapper.properties', BF.GRADLE_WRAPPER_PROPERTIES || '');
    add('gradlew', BF.GRADLEW || '');
    add('gradlew.bat', BF.GRADLEW_BAT || '');
  }
  /* 一键构建脚本 */
  add('build.bat', buildBatScript(c));
  add('build.sh', buildShScript(c));

  var stats = {
    total: files.length,
    java: files.filter(function (f) { return /\.java$/.test(f.path); }).length,
    textures: files.filter(function (f) { return /\.png$/.test(f.path); }).length,
    json: files.filter(function (f) { return /\.json$/.test(f.path); }).length,
    recipes: files.filter(function (f) { return /\/recipes\//.test(f.path); }).length,
    worldgen: files.filter(function (f) { return /\/worldgen\/|\/biome_modifier\//.test(f.path); }).length
  };
  add('README.md', readme(c, stats));
  stats.total = files.length;
  /* ---- 导出自检警告：帮用户在导出前发现"进游戏后三无"类问题 ---- */
  var warnings = [];
  c.els.forEach(function (e) {
    var isB = ['block','workstation','energy','generator','cluster'].indexOf(e.type) >= 0;
    if (e.reg !== e._reg) {
      warnings.push('「' + (e.name || e._reg) + '」的注册名「' + e.reg +
        '」含非法字符，游戏内 ID 将是 <code>' + c.modid + ':' + e._reg + '</code>（建议改用英文小写）');
    }
    if (isB) {
      var keys = BF.texKeys ? BF.texKeys(e) : Object.keys(e.textures);
      var empty = keys.every(function (k) {
        var t = e.textures[k]; return !t || !t.data || !t.data.some(function (px) { return px; }); });
      if (empty) warnings.push('「' + (e.name || e._reg) + '」的所有贴图都是空的，游戏里会是紫黑方块，请到「外观绘制」画贴图');
    }
    if (e.craftable !== false && !(e.recipes || []).length) {
      warnings.push('「' + (e.name || e._reg) + '」没有添加合成配方，导出时已自动补一条默认配方（可在配方中心修改）');
    }
  });

  return { files:files, stats:stats, ctx:c, warnings:warnings };
};

BF.previewProject = function (state) {
  return BF.buildProject(state, { png:function () { return '[二进制 PNG 贴图]'; } });
};
BF.exportZip = function (state) {
  try {
    var built = BF.buildProject(state);
    var blob = BF.zipFiles(built.files);
    BF.saveFile(blob, built.ctx.modid + '-forge-1.20.1.zip');
    if (BF.toast) BF.toast('已导出 ' + built.stats.total + ' 个文件的完整 Forge 工程');
    return built.stats;
  } catch (err) {
    console.error(err);
    if (BF.toast) BF.toast('导出失败：' + err.message, true);
    return null;
  }
};

function fieldHTML(d, e) {

  var inner = '';

    case 'textarea': inner = '<textarea ' + common + '>' + esc(v) + '</textarea>'; break;
    case 'number': inner = '<input type="number" ' + common + ' value="' + esc(v) + '"' +
      (d.min!=null?' min="'+d.min+'"':'') + (d.max!=null?' max="'+d.max+'"':'') +

function initPaint(e) {
  var canvas = $('#paint-canvas'); if (!canvas) return;
  BF.pe = new BF.PixelEditor(canvas, function () {
    BF.dirty(); BF.refreshPreview(); updateTexTabs(e);
  });
  BF.pe.tool = BF.state.paintTool || 'pencil';
  BF.pe.color = BF.state.paintColor || '#7ac74f';
  BF.pe.secondary = BF.state.paintSecondary || '#ffffff';
  BF.pe.brush = BF.state.brushSize || 1;
  BF.pe.symmetry = BF.state.symmetry || 'none';
  BF.pe.onHistory = function (u,r) {
    var l = $('#hist-label'); if (l) l.textContent = '可撤销 ' + u + ' 步 / 重做 ' + r + ' 步';
  };
  BF.pe.onPickColor = function (c) { selectColor(c); addHistory(c); };
  BF.pe.onPickSecondary = function (c) {
    BF.state.paintSecondary = c;
    var box = $('#secondary-box'); if (box) box.style.background = c;
    addHistory(c); BF.dirty();
  };
  BF.pe.load(e.textures[currentTexKey(e)]);
  var z = $('[data-act="zoom"]'); if (z) z.value = BF.pe.zoom;
  var zl = $('#zoom-label'); if (zl) zl.textContent = BF.pe.zoom + '×';
  BF.pe._hist();
  updateTexTabs(e); renderHistory(); renderFaceMinis(e);
}
function updateTexTabs(e) {
  var key = currentTexKey(e);
  var sub = $('#paint-sub');
  if (sub) sub.textContent = BF.TEX_LABEL[key] + ' · ' + e.textures[key].w + '×' + e.textures[key].h;
  renderFaceMinis(e);
}
function renderFaceMinis(e) {
  BF.texKeys(e).forEach(function (k) {
    var span = $('#mini-' + k); if (!span) return;
    span.style.background = '#222';
    var t = e.textures[k];
    if (!t) return;
    var c = BF.textureCanvas(t, 11);
    span.style.background = 'url(' + c.toDataURL('image/png') + ') center/contain no-repeat';
  });
}
function addHistory(c) {
  BF.state.colorHistory = BF.state.colorHistory || [];
  var h = BF.state.colorHistory.filter(function (x) { return x !== c; });
  h.unshift(c); BF.state.colorHistory = h.slice(0,16);
  renderHistory();
}
function renderHistory() {
  var box = $('#color-history'); if (!box) return;
  box.innerHTML = (BF.state.colorHistory||[]).map(function (c) {
    return '<div class="hist-dot" data-act="hist" data-color="' + c + '" style="background:' + c + '" title="' + c + '"></div>';
  }).join('');
}
function selectColor(c) {
  BF.state.paintColor = c;
  if (BF.pe) BF.pe.color = c;
  var cc = $('#custom-color'), hh = $('#custom-hex');
  if (cc) cc.value = c; if (hh) hh.value = c;
  document.querySelectorAll('.swatch').forEach(function (s) {
    s.classList.toggle('active', s.dataset.color.toLowerCase() === c.toLowerCase()); });
}

/* ================= recipe panel ================= */
function refThumb(ref, size) {
  var c = null;
  if (ref && ref.indexOf('elem:')===0) {
    var e = BF.get(ref.slice(5));
    if (e) {
      var t = e.textures.main || e.textures.top || e.textures.skin || e.textures.egg;
      if (t) c = BF.textureCanvas(t, size);
    }
  }
  if (!c) {
    c = document.createElement('canvas'); c.width=size; c.height=size;
    var cx = c.getContext('2d');
    cx.fillStyle='#2b323c'; cx.fillRect(0,0,size,size);
    cx.fillStyle='#7f8b9a'; cx.font='bold ' + Math.floor(size/3) + 'px monospace';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(BF.refLabel(ref).slice(0,3), size/2, size/2);
  }
  return c;
}

function fillRecipeThumbs(e) {
  var r = (e.recipes||[])[BF.state.recipeIdx||0];

  document.querySelectorAll('.craft-slot').forEach(function (el) {
    var i = +el.dataset.i, ref = r.grid[i];
    el.innerHTML = '<span class="clr">×</span>';
    if (ref) el.insertBefore(refThumb(ref, 44), el.firstChild);
    else { var s=document.createElement('span'); s.className='sname'; s.textContent='点击选择'; el.insertBefore(s,el.firstChild); }
  });

  if (box) { box.innerHTML=''; box.appendChild(refThumb('elem:'+e.id, 56)); }
}

function bindSlotDrag(e, node, i) {
  var start = null;
  node.addEventListener('pointerdown', function (ev) {
    if (ev.target.tagName === 'SELECT') return;
    ev.preventDefault(); ev.stopPropagation();
    try { node.setPointerCapture(ev.pointerId); } catch (err) {}
    var s = e.ui.slots[i];
    start = { mx:ev.clientX, my:ev.clientY, x:s.x, y:s.y };
    BF.state.guiSel = i; BF.dirty();
  });
  node.addEventListener('pointermove', function (ev) {
    if (!start) return;
    var s = e.ui.slots[i];
    s.x = Math.max(4, Math.min(158, Math.round(start.x + (ev.clientX-start.mx)/2)));
    s.y = Math.max(4, Math.min(148, Math.round(start.y + (ev.clientY-start.my)/2)));
    node.style.left = ((s.x-1)*2)+'px'; node.style.top = ((s.y-1)*2)+'px';
  });
  node.addEventListener('pointerup', function () {
    if (!start) return;
    start = null; BF.dirty(); renderGuiSlots(e); BF.refreshPreview();
  });
}

BF.initBrandEditors = function () {
  if (!BF.PixelEditor) return;
  var m = BF.state.meta;
  var defs = [
    { key:'tab', get:function () { return m.creativeTab.icon; },
      reset:function () { return BF.defaultCreativeTabIcon(); } },
    { key:'pack', get:function () { return m.packIcon; },
      reset:function () { return BF.defaultPackIcon(); } }
  ];
  BF._brandEditors = {};
  defs.forEach(function (d) {
    var cv = document.getElementById('brand-' + d.key + '-canvas');
    if (!cv) return;
    var ed = new BF.PixelEditor(cv, function () { BF.dirty(); });
    ed.tool = 'pencil';
    ed.color = BF.state.paintColor || '#7ac74f';
    ed.load(d.get());
    BF._brandEditors[d.key] = ed;
    var color = document.querySelector('[data-brand-color="' + d.key + '"]');
    if (color) color.addEventListener('input', function () { ed.color = this.value; });
    var file = document.getElementById('brand-' + d.key + '-file');
    if (file) file.addEventListener('change', function () {
      if (!this.files[0]) return;
      ed.importImage(this.files[0], function () { BF.toast('图片已导入画布'); });
      this.value = '';

  });
  var title = document.querySelector('[data-brand="title"]');
  if (title) title.addEventListener('input', function () {
    m.creativeTab.title = this.value; BF.dirty();
  });
  var enabled = document.querySelector('[data-brand="enabled"]');
  if (enabled) enabled.addEventListener('change', function () {
    m.creativeTab.enabled = this.checked; BF.dirty();
  });

    btn.addEventListener('click', function () {
      var key = btn.dataset.target, ed = BF._brandEditors[key];
      if (!ed) return;

      if (act === 'upload') {
        var f = document.getElementById('brand-' + key + '-file');

        if (!src || !Array.isArray(src.data)) { BF.toast('当前元素没有可复制的贴图', true); return; }
        var t = BF.resizeTex(src, ed.tex.w);
        ed.pushHistory(); ed.tex.data = t.data;
      }
      ed.render(); ed.onChange();
    });
  });

/* ================= live preview ================= */
function quad(ctx, pts, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function face(ctx, tex, A, U, V, cx0, cy0, shade) {
  var w=tex.w,h=tex.h;
  for (var j=0;j<h;j++) for (var i=0;i<w;i++) {
    var col=tex.data[j*w+i]; if (!col) continue;
    var u0=i/w,u1=(i+1)/w,v0=j/h,v1=(j+1)/h;
    function P(u,v){ return [cx0+A[0]+u*U[0]+v*V[0], cy0+A[1]+u*U[1]+v*V[1]]; }
    quad(ctx,[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)],BF.shade(col,shade));
  }
}
function drawIso(ctx, e, cx0, cy0, size) {
  var W=size*2,H=size,HH=size;
  var top=e.textures.top||e.textures.main||{w:16,h:16,data:[]};
  var r=(BF.state.previewFacing||0)%4, pair=SIDES[r];
  var leftT=e.textures[pair[0]]||top, rightT=e.textures[pair[1]]||top;
  var A=[0,-H/2],B=[W/2,0],C=[0,H/2],D=[-W/2,0];
  face(ctx,leftT,D,[C[0]-D[0],C[1]-D[1]],[0,HH],cx0,cy0,.72);
  face(ctx,rightT,C,[B[0]-C[0],B[1]-C[1]],[0,HH],cx0,cy0,.55);
  face(ctx,top,A,[B[0]-A[0],B[1]-A[1]],[D[0]-A[0],D[1]-A[1]],cx0,cy0,1);
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(cx0+A[0],cy0+A[1]); ctx.lineTo(cx0+B[0],cy0+B[1]);
  ctx.lineTo(cx0+B[0],cy0+B[1]+HH); ctx.lineTo(cx0+C[0],cy0+C[1]+HH);
  ctx.lineTo(cx0+D[0],cy0+D[1]+HH); ctx.lineTo(cx0+D[0],cy0+D[1]);
  ctx.closePath(); ctx.stroke();
}
function drawTextureLarge(ctx, tex, x, y, px) {
  for (var j=0;j<tex.h;j++) for (var i=0;i<tex.w;i++) {
    var c=tex.data[j*tex.w+i]; if (c) { ctx.fillStyle=c; ctx.fillRect(x+i*px,y+j*px,px,px); }
  }
}
/* isometric preview of the creature part list */
function drawMob3D(ctx, e) {
  var W=340,H=300;
  ctx.clearRect(0,0,W,H);
  var parts=(e.mobParts||[]).slice().sort(function(a,b){
    return (a.pivot[0]+a.pivot[2])-(b.pivot[0]+b.pivot[2]); });
  var s=5.2;
  function P(x,y,z){ return [(x-z)*s+170, (x+z)*s*0.5-y*s+258]; }
  parts.forEach(function(p){
    var x0=p.pivot[0]+p.offset[0], y0=p.pivot[1]+p.offset[1], z0=p.pivot[2]+p.offset[2];
    var w=p.size[0],h=p.size[1],d=p.size[2],c=p.color||'#cccccc';
    var A=P(x0,y0+h,z0),B=P(x0+w,y0+h,z0),C=P(x0+w,y0+h,z0+d),D=P(x0,y0+h,z0+d);
    var E=P(x0,y0,z0),F=P(x0+w,y0,z0),G=P(x0+w,y0,z0+d),H=P(x0,y0,z0+d);
    quad(ctx,[F,G,C,B],BF.shade(c,0.74));
    quad(ctx,[E,F,B,A],BF.shade(c,0.9));
    quad(ctx,[A,B,C,D],BF.shade(c,1.0));
  });
}
/* texture preview with per-part UV boxes */
function drawMobUv(ctx, e) {

function numVal(el) {

  }

  if (el.dataset.rec && el.dataset.id) {

    if (target) {
      if (el.dataset.rec === 'craftable') target.craftable = el.checked;
      if (el.dataset.rec === 'creative') target.showInCreative = el.checked;

    if (!e.ore) e.ore = BF.defaultOre();
    e.ore.targets = e.ore.targets || [];
    var t = el.dataset.oreTarget, idx = e.ore.targets.indexOf(t);
    if (el.checked && idx < 0) e.ore.targets.push(t);

  }

    for (var mi=0; mi<mpath.length-1; mi++) mobj = mobj[mpath[mi]] || (mobj[mpath[mi]] = {});
    var arr = mobj[mpath[mpath.length-1]] || (mobj[mpath[mpath.length-1]] = []);
    var i = arr.indexOf(v);
    if (el.checked && i < 0) arr.push(v);
    if (!el.checked && i >= 0) arr.splice(i,1);
    el.parentNode.classList.toggle('on', el.checked);
    BF.dirty(); BF.renderFileList(); return;
  }
  /* creature part editor */
  if (el.dataset.mobPart && e) {

    else if (pk === 'ox' || pk === 'oy' || pk === 'oz') mpart.offset[['ox','oy','oz'].indexOf(pk)] = Number(el.value)||0;

    BF.dirty(); return;
  }
  if (el.dataset.ore && e) {
    if (!e.ore) e.ore = BF.defaultOre();
    e.ore[el.dataset.ore] = numVal(el);
    BF.dirty(); BF.renderFileList(); return;
